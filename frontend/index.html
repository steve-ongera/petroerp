<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3d4fef" />
    <meta name="color-scheme" content="light" />

    <title>PetroERP | Fuel Trading &amp; Logistics</title>
    <meta
      name="description"
      content="PetroERP: fuel trading, procurement, inventory, logistics and finance for Dalmar Transporters, in one system."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="author" content="Steve Ongera" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Fonts: Inter (UI, headings) + IBM Plex Mono (amounts, codes, litres).
         These are the two families main.css asks for (--font-body / --font-mono).
         Weights match what the design system uses: 400 body, 500-600 UI, 700-800 headings.
         Loaded here (not via @import in main.css) so they don't block CSS parsing. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons (the only third-party CSS: main.css is self-contained, do NOT add Bootstrap) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      /* Pre-React paint: same font, background and scale as main.css so there is no flash/jump */
      html { font-size: 100%; }
      html, body {
        margin: 0;
        height: 100%;
        background: #f6f7fb;
        color: #111633;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-feature-settings: 'cv11', 'ss01';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f7fb;
      }
      #boot-loader .ring {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        border: 3px solid #e8ebff;
        border-top-color: #3d4fef;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <!-- React replaces everything inside #root the moment it mounts -->
    <div id="root">
      <div id="boot-loader" role="status" aria-label="Loading PetroERP">
        <div class="ring"></div>
      </div>
    </div>

    <noscript>PetroERP needs JavaScript enabled to run.</noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
